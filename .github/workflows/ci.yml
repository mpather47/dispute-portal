name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-api:
    name: .NET Tests
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: TestPassword123!
          ACCEPT_EULA: Y
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'TestPassword123!' -Q 'SELECT 1' -No"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DisputePortal.sln

      - name: Build
        run: dotnet build DisputePortal.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test DisputePortal.Tests/DisputePortal.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=results.trx"
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=DisputePortalTest;User Id=SA;Password=TestPassword123!;TrustServerCertificate=True"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: "**/*.trx"

  test-client:
    name: React Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dispute-portal-client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dispute-portal-client/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --max-warnings 0

      - name: Test
        run: npm test -- --run --reporter=verbose

  build-docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-api, test-client]

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t dispute-portal-api ./DisputePortal.Api

      - name: Build client image
        run: docker build -t dispute-portal-client ./dispute-portal-client
