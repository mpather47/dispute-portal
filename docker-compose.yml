services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: disputeportal-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: DisputePortal.Api/Dockerfile
    container_name: disputeportal-api
    depends_on:
      - sqlserver
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=DisputePortalDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__Issuer: "DisputePortal"
      Jwt__Audience: "DisputePortalClient"
      Jwt__Key: "${JWT_KEY}"
      Cors__AllowedOrigins: "${ALLOWED_ORIGINS}"
    ports:
      - "7000:8080"

volumes:
  sqlserver_data:
